<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>花满洪山 · 声音试听</title>
<style>
*{box-sizing:border-box;letter-spacing:0}body{margin:0;background:#f3f6f7;color:#284a41;font:15px/1.5 "Microsoft YaHei",sans-serif}main{max-width:850px;margin:32px auto;padding:0 20px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #d8e1e3;padding-bottom:18px}h1{font-size:24px;margin:0}h2{font-size:17px;margin:28px 0 12px}button{padding:9px 14px;border:1px solid #cad6d8;background:white;color:#284a41;border-radius:6px;cursor:pointer}.track{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:center;padding:13px 0;border-bottom:1px solid #e0e7e9}audio{width:100%;height:38px}small{display:block;color:#72878b;font-size:12px}@media(max-width:540px){main{margin:20px auto}.track{grid-template-columns:1fr;gap:8px}h1{font-size:20px}button{white-space:nowrap}}
</style>
<main><header><h1>花满洪山 · 声音试听</h1><button id="stop">停止播放</button></header><section id="cues"><h2>操作与提示</h2></section><section id="weather"><h2>天气环境</h2></section></main>
<script>
const groups={cues:[['seed','播种'],['build','建造建筑'],['develop','开发地形'],['road','铺设道路'],['draw','抽牌'],['select','选择'],['rotate','旋转'],['cancel','取消'],['warning','无法操作'],['reward','获得奖励'],['turn','回合开始'],['victory','游戏结束'],['weather','天气生效'],['rainbow','彩虹'],['thunder','远处雷声']],weather:[['rain','雨季 / 台风雨声'],['storm','台风风声'],['sand','沙尘暴'],['dry','旱季干风']]};
for(const [group,tracks] of Object.entries(groups)){for(const [file,label] of tracks){const row=document.createElement('div');row.className='track';const name=document.createElement('div');name.textContent=label;const detail=document.createElement('small');detail.textContent=group==='weather'?'12 秒 · 立体声循环':'短音效';name.append(detail);const player=document.createElement('audio');player.controls=true;player.preload='metadata';player.src=file+'.wav';player.loop=group==='weather';player.volume=.6;player.setAttribute('aria-label',label);player.addEventListener('play',()=>{document.querySelectorAll('audio').forEach(other=>{if(other!==player)other.pause()})});row.append(name,player);document.getElementById(group).append(row)}}
document.getElementById('stop').onclick=()=>document.querySelectorAll('audio').forEach(player=>{player.pause();player.currentTime=0});
</script>
</html>
