<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640">
  <defs>
    <linearGradient id="frontGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7896a1"/>
      <stop offset="0.48" stop-color="#557985"/>
      <stop offset="1" stop-color="#3f626f"/>
    </linearGradient>
    <linearGradient id="sideGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a6e7b"/>
      <stop offset="1" stop-color="#294b58"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f4f3"/>
      <stop offset="1" stop-color="#b9c4c4"/>
    </linearGradient>
    <pattern id="frontGrid" width="25" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 0H25M0 0V18" fill="none" stroke="#e3e8e7" stroke-width="3"/>
      <path d="M4 4H21V14H4Z" fill="#89a7b1" fill-opacity=".15"/>
    </pattern>
    <pattern id="sideGrid" width="20" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 0H20M0 0V18" fill="none" stroke="#cbd5d4" stroke-width="2.6"/>
    </pattern>
    <pattern id="louver" width="15" height="12" patternUnits="userSpaceOnUse">
      <path d="M2 0V12" stroke="#e4e9e8" stroke-width="4"/>
    </pattern>
  </defs>

  <path d="M74 563L388 414L727 475L414 626Z" fill="#1f3740" opacity=".16"/>
  <path d="M97 548L382 417L704 475L421 608Z" fill="#dce2df"/>
