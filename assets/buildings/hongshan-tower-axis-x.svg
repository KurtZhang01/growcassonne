  <!-- Main tower: one clean slab, matching the photographed proportions. -->
  <path d="M129 116L224 70L489 101L392 150Z" fill="url(#roof)" stroke="#aab6b5" stroke-width="5"/>
  <path d="M129 116L392 150V494L129 449Z" fill="url(#frontGlass)"/>
  <path d="M129 116L392 150V494L129 449Z" fill="url(#frontGrid)" opacity=".98"/>
  <path d="M392 150L489 101V447L392 494Z" fill="url(#sideGlass)"/>
  <path d="M392 150L489 101V447L392 494Z" fill="url(#sideGrid)" opacity=".96"/>

  <!-- Strong corner posts and the recessed mechanical crown. -->
