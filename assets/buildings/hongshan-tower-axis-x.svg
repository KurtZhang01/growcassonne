    <text x="274" y="466" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="14" font-weight="700" fill="#334f59">洪山科创大厦</text>
  </g>

  <!-- Low glazed gallery visibly joins tower and podium without overlapping silhouettes. -->
