<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>江城建筑资产</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8e7ef;color:#3d465b;font:14px 'Microsoft YaHei',sans-serif}header{padding:24px 32px;background:#f6f7fa;display:flex;gap:24px;align-items:center;flex-wrap:wrap}h1{font-size:22px;margin:0}button{border:1px solid #a9b2c2;background:#fff;color:#3d465b;border-radius:4px;padding:9px 18px;cursor:pointer}button[aria-pressed=true]{background:#496880;color:white}main{padding:24px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}article{background:#f4f4f9;border:1px solid #d2d5e0;border-radius:6px;overflow:hidden}h2{font-size:17px;margin:0;padding:16px 18px 0}.art{display:block;width:100%;aspect-ratio:760/640;object-fit:contain}.photo{display:block;width:100%;height:180px;object-fit:contain;background:#e1e4e9}p{margin:12px 18px;line-height:1.6}a{color:#436985}footer{padding:8px 32px 30px;line-height:1.8}@media(max-width:1000px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){main{grid-template-columns:1fr;padding:12px}header{padding:18px}}
</style>
<header><h1>江城建筑资产</h1><nav id="directions" aria-label="建筑朝向"></nav></header><main id="gallery"></main>
<footer>六组建筑取自参考插画的建筑类型。除洪山科创大厦外，具体名称仍需核对；照片用于造型研究，来源见每栋建筑下方链接。武大、华中科技大学已作为二级建筑接入，图书馆替换原一级建筑。窗格、屋顶、铺装共用棋盘相机的 42° 俯角与 42° 方位角。四个方向为坐标旋转重绘，未使用镜像。</footer>
<script>
const entries=[['library','武汉理工大学南湖图书馆','已核实：洪山区南湖校区','https://www.gooood.cn/library-of-south-lake-campus-of-wuhan-university-of-technology-china-by-architectural-design-and-research-institute-of-scut.htm'],['hongshan','洪山科创大厦','名称明确；实景参考','https://www.wh.ztx0755.com/xiezilou/1-1472.html'],['gate','校园牌坊','候选：武汉大学牌坊','https://k.sina.com.cn/article_5901594916_15fc33124001002nj1.html'],['campus','低层创新园区','候选参考：创意天地园区','https://design.citic/portal/article/index/id/2588.html'],['redhall','红砖山墙楼','候选参考：华中科技大学校园建筑，未确认同一建筑','https://www.sicas.cn/School/183/Contents/110815105210771.shtml'],['arena','白色拱顶场馆','候选参考：武汉体育学院体育馆','https://www.tal-china.com/wap/content/?434.html'],['office','白色框架办公楼','类型参考：创意天地创意工坊，未确认同一建筑','https://k.sina.cn/article_6135747824_p16db814f000100yte8.html?from=photo']];
let turn=0;const gallery=document.querySelector('#gallery');
entries.forEach(([id,name,status,url])=>{const article=document.createElement('article');article.innerHTML=`<h2>${name}</h2><a class="vector" href="isometric/${id}-0.svg"><img class="art" data-kind="${id}" src="isometric/${id}-0.svg" alt="${name} 0 度"></a><img class="photo" src="references/${id}.jpg" alt="${status}"><p>${status}<br><a href="${url}" target="_blank" rel="noopener">实景来源</a></p>`;gallery.append(article)});
for(let i=0;i<4;i++){const b=document.createElement('button');b.textContent=`${i*90}°`;b.setAttribute('aria-pressed',i===0);b.onclick=()=>{turn=i;document.querySelectorAll('#directions button').forEach((el,j)=>el.setAttribute('aria-pressed',j===i));document.querySelectorAll('.art').forEach(img=>{img.src=`isometric/${img.dataset.kind}-${i}.svg`;img.parentElement.href=img.src;img.alt=`${img.dataset.kind} ${i*90} 度`})};document.querySelector('#directions').append(b)}
</script></html>
