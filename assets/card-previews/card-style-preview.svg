    <g transform="translate(394 42)"><rect width="144" height="204" rx="10" fill="#e8c34f" stroke="#ae8424"/><rect width="144" height="204" rx="10" fill="url(#roadPattern)"/><text x="14" y="27" font-size="15" fill="#5d4919">Ⅲ 道路</text><path d="M35 82h74v15H35zm7-22h9v61h-9zm51 0h9v61h-9z" fill="#765c23"/><path d="M44 75l55 22m-55 0 55-22" stroke="#f4df87" stroke-width="5"/><text x="72" y="173" text-anchor="middle" font-size="12" fill="#5d4919">连接 3 段道路</text><text x="72" y="193" text-anchor="middle" font-size="10" fill="#72591f">道路卡</text></g>
