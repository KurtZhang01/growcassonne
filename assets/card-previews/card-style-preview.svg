  <text x="380" y="280" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#52635e">基础卡面视觉确认稿 · 右侧卡牌在叠放时覆盖左侧卡牌</text>
