<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>花满洪山 - 开始页面布局示意</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
    width: 1280px; height: 720px; overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    position: relative;
    background: #5a8a7d;
}

/* 山体网格背景 */
.mountain-grid {
    position: absolute; inset: 0;
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    grid-template-rows: repeat(10, 1fr);
    gap: 2px;
    padding: 2px;
    transform: perspective(800px) rotateX(55deg) rotateZ(0deg);
    transform-origin: center center;
}
.mountain-tile {
    background: linear-gradient(135deg, #8aaa9a 0%, #6e9488 40%, #5a7e72 100%);
    border-radius: 3px;
    position: relative;
    border: 1px solid #4a6e62;
}
.mountain-tile::before {
    content: '';
    position: absolute;
    top: 15%; left: 20%;
    width: 0; height: 0;
    border-left: 12px solid transparent;
    border-right: 8px solid transparent;
    border-bottom: 18px solid #9abcaa;
    filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.2));
}
.mountain-tile:nth-child(3n)::before {
    border-bottom-color: #a8c8b4;
    border-left-width: 14px;
    border-bottom-width: 22px;
}
.mountain-tile:nth-child(5n)::before {
    left: 40%;
    border-bottom-color: #8aaa9a;
    border-bottom-width: 15px;
}
.mountain-tile:nth-child(7n+2) { background: linear-gradient(135deg, #7a9a8a 0%, #6e8e80 40%, #5a7a6e 100%); }
.mountain-tile:nth-child(11n+3) { background: linear-gradient(135deg, #8aaa9a 0%, #7a9a8e 40%, #6a8a7e 100%); }

/* 遮罩层 */
.overlay {
    position: absolute; inset: 0;
    background: rgba(5, 12, 10, 0.12);
    pointer-events: none;
}

/* 内容区 */
.content {
    position: absolute; inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
}

/* 主标题 */
.title {
    margin-bottom: 6px;
}
.title h1 {
    font-size: 72px;
    font-weight: 900;
    letter-spacing: 16px;
    color: transparent;
    background: linear-gradient(180deg, #fff8e8 0%, #f5e0c0 60%, #e8d0a0 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-stroke: 3px #254940;
    paint-order: stroke fill;
    text-shadow: 0 4px 12px rgba(0,0,0,0.3);
    filter: drop-shadow(0 2px 4px rgba(37,73,64,0.5));
}
.title h2 {
    font-size: 20px;
    font-weight: 400;
    letter-spacing: 8px;
    color: #f3cf8d;
    text-align: center;
    -webkit-text-stroke: 1px #254940;
    text-shadow: 0 2px 6px rgba(0,0,0,0.3);
    margin-top: 2px;
}

/* 玩家选择 */
.players {
    display: flex;
    gap: 16px;
    margin-top: 40px;
}
.player-btn {
    width: 120px; height: 60px;
    background: rgba(8, 18, 16, 0.85);
    border: 2px solid rgba(255,255,255,0.15);
    border-bottom: 4px solid;
    border-radius: 8px;
    color: #e8ece8;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
}
.player-btn:nth-child(1) { border-bottom-color: #4ade80; }
.player-btn:nth-child(2) { border-bottom-color: #60a5fa; }
.player-btn:nth-child(3) { border-bottom-color: #fb923c; }
.player-btn:nth-child(4) { border-bottom-color: #c084fc; }
.player-btn:hover {
    background: rgba(15, 30, 25, 0.92);
    border-color: rgba(255,255,255,0.3);
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
}

/* 底部说明 */
.footer {
    margin-top: 48px;
    text-align: center;
}
.footer p {
    color: rgba(255,255,255,0.55);
    font-size: 15px;
    letter-spacing: 2px;
    margin: 4px 0;
}
.footer p:last-child {
    color: rgba(255,255,255,0.3);
    font-size: 13px;
}
</style>
</head>
<body>

<!-- 山体网格 -->
<div class="mountain-grid" id="grid"></div>
<div class="overlay"></div>

<!-- 主内容 -->
<div class="content">
    <div class="title">
        <h1>花满洪山</h1>
        <h2>H O N G S H A N &nbsp; I N &nbsp; B L O O M</h2>
    </div>
    <div class="players">
        <div class="player-btn">2 人</div>
        <div class="player-btn">3 人</div>
        <div class="player-btn">4 人</div>
    </div>
    <div class="footer">
        <p>武汉洪山区主题</p>
        <p>GGJ 2025 · GROW Theme</p>
    </div>
</div>

<script>
// 生成12×10山体网格
const grid = document.getElementById('grid');
for (let i = 0; i < 120; i++) {
    const tile = document.createElement('div');
    tile.className = 'mountain-tile';
    // 随机小山峰位置偏移
    const offset = Math.random() * 30;
    tile.style.setProperty('--peak-offset', offset + '%');
    grid.appendChild(tile);
}
</script>
</body>
</html>
