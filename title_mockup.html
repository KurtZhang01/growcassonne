<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>花满洪山 · 开始界面预览</title>
<style>
*{box-sizing:border-box;letter-spacing:0}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#c7e7f3;color:#284a41;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
#landscape{position:fixed;inset:0;width:100%;height:100%}
.veil{position:fixed;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(240,250,255,.96),rgba(240,250,255,.88) 27%,rgba(240,250,255,.1) 46%,rgba(240,250,255,.1) 61%,rgba(245,250,250,.88) 82%,rgba(245,250,250,.97))}
header{position:absolute;top:13%;left:20px;right:20px;text-align:center;pointer-events:none}
.english{position:absolute;top:-24px;left:0;right:0;font-size:15px;line-height:22px;color:#5e797d}
h1{font-family:KaiTi,STKaiti,"Noto Serif CJK SC",serif;font-size:96px;line-height:126px;font-weight:400;margin:0;text-shadow:0 2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff}
.tagline{font-size:16px;color:#5e797d;line-height:28px;margin:3px 0 0}
.choices{position:absolute;bottom:65px;left:50%;transform:translateX(-50%);width:min(864px,calc(100% - 72px));height:min(220px,31vh);display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.choice{position:relative;isolation:isolate;appearance:none;border:0;background:none;padding:0;cursor:pointer;color:#284a41;font:inherit;min-width:0;outline:0;touch-action:manipulation}
.choice::before{content:"";position:absolute;left:25%;right:25%;bottom:64px;height:13px;background:#203b3b14;border-radius:50%;z-index:-1;transition:transform .25s}
.choice canvas{position:absolute;width:min(calc(100% + 12px),165px);aspect-ratio:1;left:50%;bottom:55px;transform:translateX(-50%);transition:transform .24s;pointer-events:none}
.choice:hover canvas,.choice:focus-visible canvas,.choice[aria-pressed=true] canvas{transform:translate(-50%,-12px) scale(1.055)}
.choice strong{position:absolute;left:0;right:0;bottom:30px;font-size:23px;font-weight:500;line-height:28px}
.choice span{position:absolute;left:0;right:0;bottom:9px;font-size:12px;line-height:18px;color:#5e797d;white-space:nowrap}
.choice::after{content:"";position:absolute;left:calc(50% - 14px);width:28px;bottom:1px;height:2px;background:var(--accent);opacity:0;transition:opacity .24s}
.choice:hover::after,.choice:focus-visible::after,.choice[aria-pressed=true]::after{opacity:1}
.choice:hover strong,.choice:focus-visible strong,.choice[aria-pressed=true] strong{color:var(--accent)}
footer{position:absolute;bottom:13px;left:20px;right:20px;text-align:center;color:#5e797d;font-size:12px;line-height:20px}
.music{position:absolute;right:36px;top:20px;width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:8px;background:#ffffff4d;cursor:pointer}
.music:hover,.music:focus-visible{background:#ffffffa6;outline:2px solid #6c8b8840}
.music img{width:20px;height:20px}
@media(max-width:599px){h1{font-size:64px;line-height:94px}.choices{width:calc(100% - 40px)}.music{right:20px}.choice strong{font-size:22px}}
@media(max-height:539px){header{top:9.5%}h1{font-size:50px;line-height:80px}.choices{bottom:42px}.choice canvas{width:min(calc(100% + 12px),calc(31vh - 55px))}}
@media(prefers-reduced-motion:reduce){.choice canvas{transition:none}}
</style>
</head>
<body>
<canvas id="landscape" aria-hidden="true"></canvas>
<div class="veil"></div>
<header><div class="english">HONGSHAN IN BLOOM</div><h1>花满洪山</h1><p class="tagline">一城山水，四季花开</p></header>
<div class="choices" aria-label="游戏人数">
<button class="choice" data-count="1" style="--accent:#d83232" aria-label="开始1人游戏" aria-pressed="false"><canvas width="400" height="400"></canvas><strong>1 人</strong><span>独自栽培</span></button>
<button class="choice" data-count="2" style="--accent:#8c4edb" aria-label="开始2人游戏" aria-pressed="false"><canvas width="400" height="400"></canvas><strong>2 人</strong><span>双人对弈</span></button>
<button class="choice" data-count="3" style="--accent:#e0802f" aria-label="开始3人游戏" aria-pressed="false"><canvas width="400" height="400"></canvas><strong>3 人</strong><span>三人同游</span></button>
<button class="choice" data-count="4" style="--accent:#1c497d" aria-label="开始4人游戏" aria-pressed="false"><canvas width="400" height="400"></canvas><strong>4 人</strong><span>四人争芳</span></button>
</div>
<button class="music" title="播放音乐" aria-label="播放音乐" aria-pressed="false"><img src="assets/ui/volume-x.svg" alt=""></button>
<footer>武汉 · 洪山 &nbsp;&nbsp; / &nbsp;&nbsp; GGJ 2026</footer>
<audio id="music" src="assets/music/Blossom in the Light.mp3" loop preload="none"></audio>
<script>
// Layout preview only. Godot renders the actual shared terrain meshes.
const canvas=document.querySelector('#landscape'),ctx=canvas.getContext('2d');
const building=new Image();building.src='assets/buildings/isometric/library-0.svg';
const topColors=['#5fae55','#3f94bd','#2f7048','#c8944e','#c7352e','#737a75'];
const midColors=['#40793a','#316b91','#214d34','#9f703a','#8f2427','#565d59'];
const botColors=['#29472c','#1f4661','#153324','#69462d','#5a1c21','#3f4542'];
const random=n=>{const v=Math.sin(n*127.1+311.7)*43758.5453;return v-Math.floor(v)};
function poly(c,points,color){c.fillStyle=color;c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fill()}
function box(c,x,y,s,h,top,left,right){poly(c,[[x-s,y],[x,y+s*.53],[x,y+s*.53+h],[x-s,y+h]],left);poly(c,[[x,y+s*.53],[x+s,y],[x+s,y+h],[x,y+s*.53+h]],right);poly(c,[[x,y-s*.53],[x+s,y],[x,y+s*.53],[x-s,y]],top)}
function mountain(c,x,y,s,h){poly(c,[[x-s,y],[x,y-h],[x+s,y],[x,y+s*.35]],'#87908b');poly(c,[[x,y-h],[x+s,y],[x,y+s*.35]],'#5f6862');poly(c,[[x-s*.22,y-h*.76],[x,y-h],[x+s*.23,y-h*.74],[x,y-h*.66]],'#d8e0d8')}
function tree(c,x,y,s){box(c,x,y,s*.09,s*.27,'#93724c','#755437','#573f2b');for(let i=0;i<3;i++){const r=s*(.46-i*.09),yy=y-s*.25-i*s*.25;poly(c,[[x-r,yy],[x,yy-s*.66],[x+r,yy],[x,yy+r*.38]],['#2a7044','#367f4a','#4a9455'][i]);poly(c,[[x,yy-s*.66],[x+r,yy],[x,yy+r*.38]],['#225d38','#2b6c3e','#387e49'][i])}}
function tile(c,x,y,s,type,seed,time,standalone=false){
box(c,x,y+9*s/42,s*.87,s*.18,midColors[type],botColors[type],botColors[type]);
box(c,x,y,s,s*.16,topColors[type],midColors[type],botColors[type]);
if(type===5){for(let i=0;i<4;i++){const dx=(random(seed+i)-.5)*s*.95,dy=(random(seed+i+8)-.5)*s*.35;mountain(c,x+dx,y+dy,s*(.21+random(seed+i+10)*.12),s*(.35+random(seed+i+20)*.35))}}
if(type===2){for(let i=0;i<3;i++)tree(c,x+(i-1)*s*.38,y+Math.abs(i-1)*s*.15,s*.62)}
if(type===0){for(let i=0;i<4;i++){const dx=(random(seed+i)-.5)*s,dy=(random(seed+i+15)-.5)*s*.45;c.fillStyle=['#4b913e','#76b854','#397a3d'][i%3];c.beginPath();c.ellipse(x+dx,y+dy,s*.12,s*.085,0,0,Math.PI*2);c.fill()}}
if(type===1){c.save();c.translate(x,y);c.scale(1,.48);for(let i=0;i<2;i++){c.strokeStyle='#bce8f18a';c.lineWidth=s*.025;c.beginPath();c.arc(0,0,s*(.23+i*.18+Math.sin(time+seed)*.025),.1,Math.PI*1.8);c.stroke()}c.restore()}
if(type===4&&building.complete&&building.naturalWidth){const b=s*(standalone?3:2.8);c.drawImage(building,x-b/2,y-b*.64,b,b*640/760)}
}
let w=0,h=0,pointer={x:0,y:0},offset={x:0,y:0};
function resize(){w=innerWidth;h=innerHeight;const d=Math.min(devicePixelRatio,2);canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);resize();
addEventListener('pointermove',e=>{pointer.x=(e.clientX/w-.5)*8;pointer.y=(e.clientY/h-.5)*5});
let last=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(ms){requestAnimationFrame(frame);if(ms-last<32)return;last=ms;const time=reduced?0:ms/1000;offset.x+=(pointer.x-offset.x)*.06;offset.y+=(pointer.y-offset.y)*.06;
ctx.clearRect(0,0,w,h);ctx.fillStyle='#c7e7f3';ctx.fillRect(0,0,w,h);
const s=Math.max(w/32,h/23),ox=w*.5+offset.x,oy=h*.5+offset.y;
for(let sum=-26;sum<=26;sum++){for(let x=-13;x<=13;x++){const z=sum-x;if(z< -13||z>13)continue;const river=Math.abs(z-Math.sin(x*.36)*2.1+.7);let type=river<1.05?1:river<2.2?0:5;if(type===5&&Math.sin(x*.3+1.7)*Math.cos(z*.35)>.2)type=random(x*13+z)>.5?0:2;if(x===-4&&z===3||x===5&&z===-2)type=4;tile(ctx,ox+(x-z)*s,oy+(x+z)*s*.53,s+.35,type,x*63+z*7,time)}}
document.querySelectorAll('.choice canvas').forEach((cv,i)=>{const c=cv.getContext('2d');c.clearRect(0,0,400,400);tile(c,200,235,140,[0,1,2,4][i],i*47,time,true)});
}
requestAnimationFrame(frame);
const choices=[...document.querySelectorAll('.choice')];
function choose(button){choices.forEach(b=>b.setAttribute('aria-pressed',String(b===button)));button.focus();document.body.dataset.players=button.dataset.count}
choices.forEach(b=>b.addEventListener('click',()=>choose(b)));
addEventListener('keydown',e=>{if(e.repeat)return;if(/^[1-4]$/.test(e.key)){choose(choices[Number(e.key)-1]);e.preventDefault()}if(e.key==='ArrowLeft'||e.key==='ArrowRight'){const i=choices.indexOf(document.activeElement);choices[(Math.max(i,0)+(e.key==='ArrowRight'?1:3))%4].focus();e.preventDefault()}});
const audio=document.querySelector('#music'),musicButton=document.querySelector('.music');audio.volume=.25;
musicButton.addEventListener('click',async()=>{try{if(audio.paused){await audio.play()}else{audio.pause()}const playing=!audio.paused;musicButton.setAttribute('aria-pressed',String(playing));musicButton.title=playing?'关闭音乐':'播放音乐';musicButton.setAttribute('aria-label',musicButton.title);musicButton.querySelector('img').src='assets/ui/volume-'+(playing?'2':'x')+'.svg'}catch{musicButton.title='音乐暂不可用'}});
</script>
</body>
</html>
