<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>花之江城 - UI布局方案</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Microsoft YaHei UI","PingFang SC",sans-serif;color:#17231f;background:#92bcae}button{font:inherit}
.game{--margin:18px;--rail:214px;--left:226px;--right:292px;position:relative;width:100vw;height:100vh;min-height:700px;background:linear-gradient(#acd3c6,#78a88c);isolation:isolate}
.world{position:absolute;inset:0;overflow:hidden;background:linear-gradient(145deg,#acd2c5,#78a78c)}.world:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(23,52,43,.13),transparent 42%);pointer-events:none}.world .tile{cursor:pointer}.world .tile:hover{filter:brightness(1.12)}.world .tile.preview-active{outline:4px solid rgba(255,255,255,.78);outline-offset:3px}
.board{position:absolute;left:50%;top:52%;width:610px;height:410px;transform:translate(-50%,-50%) rotateX(58deg) rotateZ(-45deg);transform-style:preserve-3d}.tile{position:absolute;width:116px;height:116px;border:1px solid rgba(238,250,239,.5);box-shadow:8px 8px 0 #355845;background:#65a45e}.tile:before{content:"";position:absolute;inset:15px;border-radius:50%;background:#4a8a50;box-shadow:28px 18px 0 -5px #397d48,-22px 27px 0 -9px #89ba68}.tile.water{background:#4a9fc3;box-shadow:8px 8px 0 #28627a}.tile.water:before{background:transparent;border:4px solid rgba(218,246,250,.65);box-shadow:none}.tile.forest{background:#34754b;box-shadow:8px 8px 0 #204b34}.tile.forest:before{background:#205d3c;box-shadow:25px 18px 0 -3px #2b7045,-18px 28px 0 -7px #4f9556}.tile.sand{background:#cca35d;box-shadow:8px 8px 0 #8d683e}.tile.sand:before{background:#dbbb75;box-shadow:24px 20px 0 -5px #b98b4d}.t1{left:0;top:120px}.t2{left:122px;top:120px}.t3{left:244px;top:120px}.t4{left:366px;top:120px}.t5{left:488px;top:120px}.t6{left:122px;top:242px}.t7{left:244px;top:242px}.t8{left:366px;top:242px}.t9{left:244px;top:-2px}
.topbar{position:absolute;z-index:4;left:var(--margin);right:var(--margin);top:var(--margin);height:54px;display:flex;align-items:center;gap:23px;padding:0 18px;background:rgba(244,244,238,.42);border:1px solid rgba(255,255,255,.38);box-shadow:0 8px 24px rgba(28,54,45,.08);backdrop-filter:blur(18px)}.brand{font-weight:800}.brand small{font-weight:600;color:#718079;margin-left:8px}.metric{font-size:12px;color:#52625c}.metric b{font-size:13px;color:#17231f;margin-left:4px}.weather{margin-left:auto;font-size:12px;color:#37657a}.weather:before{content:"";display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:#65a9d8;box-shadow:0 0 0 3px rgba(101,169,216,.2)}
.side{position:absolute;z-index:5;top:82px;bottom:254px;background:rgba(244,244,238,.40);border:1px solid rgba(255,255,255,.38);backdrop-filter:blur(18px)}.preview{left:var(--margin);width:var(--left);padding:22px 18px;box-shadow:10px 10px 26px rgba(28,54,45,.08)}.info{right:var(--margin);width:var(--right);padding:20px;box-shadow:-10px 10px 26px rgba(28,54,45,.08)}
.side-title{font-size:11px;font-weight:800;color:#68756f}.preview-name{margin:7px 0 0;font-size:18px}.preview-stage{min-height:215px;margin:20px -4px 0;padding:14px;display:flex;align-items:center;justify-content:center;background:rgba(115,146,132,.10);border-top:1px solid rgba(99,116,108,.24);border-bottom:1px solid rgba(99,116,108,.24)}.preview-grid{position:relative;width:150px;height:130px;transform:rotateX(57deg) rotateZ(-45deg)}.preview-grid i{position:absolute;width:66px;height:66px;background:#737a75;border:1px solid #adb4af;box-shadow:5px 5px 0 #464c49}.preview-grid i:before{content:"";position:absolute;left:15px;bottom:28px;width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-bottom:44px solid #59615d}.preview-grid i:nth-child(1){left:9px;top:33px}.preview-grid i:nth-child(2){left:80px;top:33px}.preview-grid i:nth-child(3){left:80px;top:104px}.preview-meta{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:17px;font-size:11px;color:#66736e}.preview-meta b{color:#17231f}.valid{margin-top:18px;padding:10px 0;border-top:1px solid rgba(99,116,108,.24);color:#427658;font-size:12px;font-weight:700}.probabilities{width:100%}.prob-row{display:grid;grid-template-columns:54px 1fr 32px;gap:8px;align-items:center;margin:11px 0;font-size:11px}.prob-bar{height:7px;background:rgba(92,108,100,.16)}.prob-bar i{display:block;height:100%;width:var(--v);background:var(--c)}.weather-preview{text-align:center}.weather-symbol{font-size:58px;line-height:1;color:#397fa9;text-shadow:0 8px 20px rgba(51,103,130,.2)}.weather-copy{margin-top:18px;font-size:12px;line-height:1.7;color:#394b45}.terrain-preview{text-align:center}.terrain-glyph{display:inline-flex;width:104px;height:70px;align-items:center;justify-content:center;background:#34754b;color:#d9f0d9;box-shadow:7px 7px 0 #214c34;font-size:40px;transform:skewY(-8deg)}
.player{display:grid;grid-template-columns:8px 1fr auto;gap:11px;align-items:center;padding:6px 0 17px;border-bottom:1px solid #ced5cf}.player-mark{height:38px;background:#d83232}.player h2{font-size:18px;line-height:1;margin:0}.player span{font-size:11px;color:#66736e}.round{font-size:22px}.section{padding:15px 0;border-bottom:1px solid #d6dcd7}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;font-size:11px;font-weight:800;color:#66736e}.progress{height:7px;background:#dce1dc}.progress i{display:block;width:42%;height:100%;background:#507e68}.rank{display:grid;grid-template-columns:8px 45px 1fr 25px;gap:8px;align-items:center;height:27px;font-size:11px}.dot{width:7px;height:7px;border-radius:50%}.bar{height:5px;background:#d8ddd8}.bar i{display:block;height:100%;background:var(--c);width:var(--v)}.history{padding-top:15px}.history-row{display:grid;grid-template-columns:5px 1fr;gap:9px;padding:7px 0;font-size:11px;line-height:1.3;color:#52625c}.history-row i{background:var(--c)}.history-row b{display:block;color:#25322e;margin-bottom:2px}
.card-rail{position:absolute;z-index:8;left:var(--margin);right:var(--margin);bottom:var(--margin);height:var(--rail);background:rgba(239,241,234,.44);border:1px solid rgba(255,255,255,.40);box-shadow:0 -10px 30px rgba(29,58,47,.10);backdrop-filter:blur(19px)}.rail-head{position:absolute;left:20px;right:20px;top:10px;display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:#66736e}.decks{position:absolute;left:20px;bottom:15px;width:280px;height:170px;display:flex;align-items:flex-end;gap:14px;border-right:1px solid rgba(95,113,104,.25)}.deck-group{text-align:center;font-size:10px;color:#66736e}.deck-group span{display:block;margin-top:9px}.hand{position:absolute;left:315px;right:80px;bottom:3px;height:192px;display:flex;justify-content:center;align-items:flex-end}
.asset-card{position:relative;border:0;padding:0;background:transparent;filter:drop-shadow(4px 7px 0 rgba(24,40,35,.23));transition:.18s ease;transform-origin:50% 100%;cursor:pointer}.asset-card:after{content:"";position:absolute;inset:3px -3px -3px 3px;background:#fff;z-index:-1;border-radius:8px}.asset-card img{display:block;width:100%;height:100%;object-fit:fill;border-radius:8px}.asset-card.preview-active img{outline:3px solid rgba(255,255,255,.92);outline-offset:2px}.deck-card{width:70px;height:99px}.deck-card:before{content:"";position:absolute;inset:-5px 5px 5px -5px;border-radius:8px;background:#fff;box-shadow:-4px -4px 0 rgba(45,67,58,.18);z-index:-2}.deck-card:hover{transform:translateY(-5px)}
.hand .asset-card{position:absolute;width:100px;height:142px;bottom:7px}.hand .asset-card:nth-child(1){--x:-170px;transform:translateX(-170px) rotate(-8deg)}.hand .asset-card:nth-child(2){--x:-112px;transform:translateX(-112px) rotate(-5deg)}.hand .asset-card:nth-child(3){--x:-54px;transform:translateX(-54px) rotate(-2deg)}.hand .asset-card:nth-child(4){--x:4px;transform:translateX(4px) rotate(1deg)}.hand .asset-card:nth-child(5){--x:62px;transform:translateX(62px) rotate(4deg)}.hand .asset-card:nth-child(6){--x:120px;transform:translateX(120px) rotate(7deg)}.hand .asset-card:hover{z-index:20;transform:translate(var(--x),-28px) scale(1.07)}.hand .selected{z-index:12;transform:translate(var(--x),-34px) scale(1.07)!important}.end-turn{position:absolute;right:20px;bottom:20px;width:46px;height:46px;border:0;background:#18382f;color:white;font-size:22px;box-shadow:0 5px 0 #0d241d;cursor:pointer}.end-turn:hover{transform:translateY(-2px)}
@media(max-width:1000px){.game{--left:190px;--right:245px}.brand small,.metric:nth-of-type(2){display:none}.hand{left:275px}.hand .asset-card{width:90px;height:128px}.decks{width:240px;gap:8px}.deck-card{width:60px;height:85px}}@media(max-width:760px){.game{--left:160px;--right:205px}.topbar{gap:10px}.metric{display:none}.preview{padding:16px 10px}.info{padding:14px 12px}.hand{left:220px;right:55px}.decks{width:200px}.deck-card{width:52px;height:74px}.hand .asset-card{width:78px;height:111px}}
</style>
</head>
<body>
<main class="game">
  <section class="world"><div class="board"><i class="tile t1" data-preview="tile-grass"></i><i class="tile water t2" data-preview="tile-water"></i><i class="tile forest t3" data-preview="tile-forest"></i><i class="tile t4" data-preview="tile-grass"></i><i class="tile sand t5" data-preview="tile-desert"></i><i class="tile forest t6" data-preview="tile-forest"></i><i class="tile t7" data-preview="tile-grass"></i><i class="tile water t8" data-preview="tile-water"></i><i class="tile sand t9" data-preview="tile-desert"></i></div></section>
  <header class="topbar"><div class="brand">花之江城 <small>WUHAN IN BLOOM</small></div><div class="metric">草地 <b>0.3</b></div><div class="metric">森林 <b>0.5</b></div><div class="metric">升级 <b>×2</b></div><div class="weather">雨季 · 2回合</div></header>
  <aside class="side preview"><span class="side-title" id="preview-type">卡牌预览</span><h2 class="preview-name" id="preview-name">3级山体开发</h2><div class="preview-stage" id="preview-stage"><div class="preview-grid"><i></i><i></i><i></i></div></div><div class="preview-meta" id="preview-meta"><span>形状</span><b>L形 · 3格</b><span>旋转</span><b>90°</b><span>生成道路</span><b>2段</b></div><div class="valid" id="preview-status">当前位置可以放置</div></aside>
  <aside class="side info"><div class="player"><i class="player-mark"></i><div><h2>玩家1</h2><span>出牌阶段</span></div><b class="round">07</b></div><section class="section"><div class="section-title"><span>守育进度</span><b>7 / 40</b></div><div class="progress"><i></i></div></section><section class="section"><div class="section-title"><span>花朵排名</span><b>播种卡 6</b></div><div class="rank"><i class="dot" style="background:#d83232"></i><span>玩家1</span><span class="bar" style="--c:#d83232;--v:100%"><i></i></span><b>86</b></div><div class="rank"><i class="dot" style="background:#8c4edb"></i><span>玩家2</span><span class="bar" style="--c:#8c4edb;--v:74%"><i></i></span><b>64</b></div><div class="rank"><i class="dot" style="background:#e0802f"></i><span>玩家3</span><span class="bar" style="--c:#e0802f;--v:58%"><i></i></span><b>50</b></div><div class="rank"><i class="dot" style="background:#1c497d"></i><span>玩家4</span><span class="bar" style="--c:#1c497d;--v:41%"><i></i></span><b>35</b></div></section><section class="history"><div class="section-title"><span>操作历史</span><b>最近4条</b></div><div class="history-row" style="--c:#d83232"><i></i><div><b>玩家1 · 道路闭合</b>获得1级播种卡</div></div><div class="history-row" style="--c:#1c497d"><i></i><div><b>玩家4 · 播种</b>森林增加20朵花</div></div><div class="history-row" style="--c:#e0802f"><i></i><div><b>玩家3 · 开发</b>生成3格新地块</div></div><div class="history-row" style="--c:#8c4edb"><i></i><div><b>玩家2 · 天气</b>雨季持续2回合</div></div></section></aside>
  <section class="card-rail"><div class="rail-head"><span>公共卡堆 · 抽牌 1 / 3</span><span>玩家1手牌 · 6张</span></div><div class="decks"><div class="deck-group"><button class="asset-card deck-card" data-preview="deck-develop"><img src="assets/card-previews/card-development.svg" alt="开发卡"></button><span>开发</span></div><div class="deck-group"><button class="asset-card deck-card" data-preview="deck-road"><img src="assets/card-previews/card-road.svg" alt="道路卡"></button><span>道路</span></div><div class="deck-group"><button class="asset-card deck-card" data-preview="deck-weather"><img src="assets/card-previews/card-weather.svg" alt="天气卡"></button><span>天气</span></div></div><div class="hand"><button class="asset-card" data-preview="card-seed"><img src="assets/card-previews/card-seed.svg" alt="播种卡"></button><button class="asset-card" data-preview="card-seed"><img src="assets/card-previews/card-seed.svg" alt="播种卡"></button><button class="asset-card selected" data-preview="card-develop"><img src="assets/card-previews/card-development.svg" alt="开发卡"></button><button class="asset-card" data-preview="card-building"><img src="assets/card-previews/card-development.svg" alt="建筑开发卡"></button><button class="asset-card" data-preview="card-road"><img src="assets/card-previews/card-road.svg" alt="道路卡"></button><button class="asset-card" data-preview="card-weather"><img src="assets/card-previews/card-weather.svg" alt="天气卡"></button></div><button class="end-turn" title="结束回合">✓</button></section>
</main>
<script>
const content={
  "card-develop":{type:"开发卡预览",name:"3级山体开发",stage:'<div class="preview-grid"><i></i><i></i><i></i></div>',meta:[["形状","L形 · 3格"],["旋转","90°"],["生成道路","2段"]],status:"拖出卡牌后显示真实地块模型"},
  "card-building":{type:"建筑卡预览",name:"黄鹤楼开发",stage:'<div class="terrain-preview"><div class="terrain-glyph" style="background:#b43b32;box-shadow:7px 7px 0 #6d2826">楼</div><div class="weather-copy">五层红色楼身 · 金色飞檐</div></div>',meta:[["占地","1 × 1"],["目标","封闭缺口"],["增益","相邻容积翻倍"]],status:"选择缺口后显示完整建筑模型"},
  "card-weather":{type:"天气效果预览",name:"雨季",stage:'<div class="weather-preview"><div class="weather-symbol">☁<br>╱╱╱</div><div class="weather-copy">植物升级概率 ×2<br>与旱季互斥 · 持续2回合</div></div>',meta:[["作用范围","全棋盘"],["持续时间","2回合"],["冲突天气","旱季"]],status:"打出后立即改变全局环境"},
  "card-seed":{type:"播种卡预览",name:"2级播种",stage:'<div class="terrain-preview"><div class="terrain-glyph" style="background:#5fae55">✿ ✿</div><div class="weather-copy">当前玩家颜色 · 增加20朵花</div></div>',meta:[["花朵数量","20"],["目标","植物地块"],["容量检查","需要"]],status:"道路地块可播种，但不会扩散"},
  "card-road":{type:"道路卡预览",name:"2级道路",stage:'<div class="terrain-preview"><div class="terrain-glyph" style="background:#e8c34f;color:#634b2e">╲╱</div><div class="weather-copy">连续拖动连接3格地块</div></div>',meta:[["路径长度","3格"],["允许转弯","是"],["建筑地块","不可通过"]],status:"路径必须上下左右连续"},
  "deck-develop":{type:"牌库概率",name:"开发卡堆",prob:[["1级山体","30%","#8b9290"],["2级山体","27%","#9b8070"],["3级山体","20%","#b7794e"],["4级山体","13%","#c47a42"],["建筑开发","10%","#c7352e"]],meta:[["卡牌类型","5类"],["本回合已抽","1张"]],status:"点击卡堆抽取后按类别与等级整理"},
  "deck-road":{type:"牌库概率",name:"道路卡堆",prob:[["1级道路","42%","#d7b64f"],["2级道路","34%","#ba9343"],["3级道路","24%","#8c6d35"]],meta:[["卡牌类型","3类"],["路径长度","2至4格"]],status:"所有道路卡均使用连续拖动放置"},
  "deck-weather":{type:"牌库概率",name:"天气卡堆",prob:[["台风","20%","#5b8eb2"],["沙尘暴","20%","#b8894c"],["雨季","20%","#65a9d8"],["旱季","20%","#d39a48"],["彩虹","20%","#7faa72"]],meta:[["卡牌类型","5类"],["重复天气","不会消耗"]],status:"互斥规则会在抽取后于预览中标明"},
  "tile-grass":{type:"地块属性",name:"草地",tile:["草","#5fae55","#3b7440"],meta:[["花朵","32 / 50"],["生长率","0.30"],["道路","东西连通"],["相邻增益","水域 ×1"]],status:"可播种 · 可修建道路"},
  "tile-water":{type:"地块属性",name:"水域",tile:["水","#3f94bd","#28627a"],meta:[["容积","0"],["升级增益","相邻植物 ×2"],["天气影响","旱季30%退化"],["道路","南北连通"]],status:"增益地块 · 不可播种"},
  "tile-forest":{type:"地块属性",name:"森林",tile:["林","#2f7048","#1c4931"],meta:[["花朵","78 / 100"],["生长率","0.50"],["扩散概率","0.50"],["道路","无"]],status:"高容量植物地块"},
  "tile-desert":{type:"地块属性",name:"荒漠",tile:["漠","#c8944e","#88643a"],meta:[["花朵","8 / 10"],["生长率","0.10"],["扩散概率","0.10"],["道路","东向出口"]],status:"容量较低 · 可播种"}
};
function renderPreview(key,source){const d=content[key];if(!d)return;document.querySelectorAll('.preview-active').forEach(x=>x.classList.remove('preview-active'));if(source)source.classList.add('preview-active');document.getElementById('preview-type').textContent=d.type;document.getElementById('preview-name').textContent=d.name;let stage=d.stage||'';if(d.prob)stage='<div class="probabilities">'+d.prob.map(p=>`<div class="prob-row"><span>${p[0]}</span><span class="prob-bar" style="--v:${p[1]};--c:${p[2]}"><i></i></span><b>${p[1]}</b></div>`).join('')+'</div>';if(d.tile)stage=`<div class="terrain-preview"><div class="terrain-glyph" style="background:${d.tile[1]};box-shadow:7px 7px 0 ${d.tile[2]}">${d.tile[0]}</div><div class="weather-copy">点击地块后显示实时结算属性</div></div>`;document.getElementById('preview-stage').innerHTML=stage;document.getElementById('preview-meta').innerHTML=d.meta.map(x=>`<span>${x[0]}</span><b>${x[1]}</b>`).join('');document.getElementById('preview-status').textContent=d.status;}
document.querySelectorAll('[data-preview]').forEach(el=>el.addEventListener('click',()=>renderPreview(el.dataset.preview,el)));
</script>
</body>
</html>
